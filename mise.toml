# ツールの版とタスク。devContainer とホストの両方でこのファイルを使う。

[vars]
# LiveKit サーバーの版(devContainer の livekit-server)
livekit_version = "1.13.9"

[tools]
python = "3.14.8"
uv = "0.12.23"
node = "24.21.0"
pnpm = "12.10.1"
terraform = "1.16.5"
buf = "1.73.0"
# macOS 向けのバイナリは配布されていないので、linux(devContainer)でだけ入れる。
# ローカルの LiveKit サーバーは devContainer で動かす(mise run livekit)
"github:livekit/livekit" = { version = "{{vars.livekit_version}}", bin = "livekit-server", os = ["linux"] }
"github:livekit/livekit-cli" = { version = "2.18.8", bin = "lk" }
# GitHub CLI(PR や CI の確認。devContainer で使う。CI では入れない)
gh = "2.102.0"
# iOS のビルド(CocoaPods)。モバイル版はホストで作るので、macOS でだけ入れる
ruby = { version = "3.4.12", os = ["macos"] }
"gem:cocoapods" = { version = "1.16.2", os = ["macos"] }

[settings]
# Ruby はソースからビルドせず、ビルド済みのものを使う
ruby.compile = false

[env]
_.file = ".env"
_.python.venv = { path = ".venv", create = false }
# Python は mise が入れたものを使い、uv には取得させない
UV_PYTHON_DOWNLOADS = "never"

[tasks.setup]
description = "依存関係をインストールする"
run = ["uv sync --all-packages", "pnpm install"]

[tasks.gen]
description = "proto と REST API から Python / TypeScript のコードを、デザイントークンから CSS と TS を生成する"
depends = ["gen:proto", "gen:api", "gen:tokens"]

[tasks."gen:tokens"]
description = "デザイントークン(packages/design-tokens/src/tokens.ts)から、Tailwind のテーマ・React Native の値・一覧を生成する"
# 依存のパッケージを使わないので、pnpm install の前でも動く
run = "node packages/design-tokens/scripts/gen.ts"

[tasks."gen:proto"]
description = "proto から Python / TypeScript の型を生成する"
run = "buf generate"

[tasks."gen:api"]
description = "Pydantic のモデルから OpenAPI を出し、TypeScript のクライアントを生成する"
dir = "packages/api-client"
run = [
  "uv run python -m voice_intercom_api.openapi > openapi.json",
  # openapi-typescript は TypeScript 7 では動かないので、5 系と一緒に dlx で動かす
  "pnpm --dir ts gen",
]

[tasks.lint]
description = "lint と型検査(JS は各パッケージの typecheck。React Router のルートの型も作る。デザインの規則は oxlint)"
run = [
  "buf lint",
  "uv run ruff check",
  "uv run ruff format --check",
  "uv run pyright",
  "pnpm -r typecheck",
  "pnpm lint:design",
]

[tasks.fmt]
description = "整形"
run = ["buf format -w", "uv run ruff format", "uv run ruff check --fix"]

[tasks.test]
description = "テスト(pytest と、JS の Vitest)"
depends = ["test:py", "test:js"]

[tasks."test:py"]
description = "Python のテスト(pytest)"
run = "uv run pytest"

[tasks."test:js"]
description = "JS のテスト(test のスクリプトがあるパッケージで Vitest)"
run = "pnpm -r --if-present test"

[tasks."build:api"]
description = "Lambda(services/api)に載せるディレクトリを .build/api に作る"
run = "scripts/build-api.sh"

[tasks."build:agent"]
description = "Agent(services/agent)のイメージを linux/arm64 でビルドする(voice-intercom-agent:local)"
run = "docker build --platform linux/arm64 -f services/agent/Dockerfile -t voice-intercom-agent:local ."

[tasks."push:agent"]
description = "Agent のイメージをビルドして ECR に push する(例: mise run push:agent dev)"
run = "scripts/push-agent.sh"

[tasks."deploy:web"]
description = "Web 版クライアントを terraform output の設定でビルドし、配信の S3 に置いて CloudFront を無効化する(例: mise run deploy:web dev)"
run = "scripts/deploy-spa.sh web"

[tasks."deploy:admin"]
description = "管理コンソールを terraform output の設定でビルドし、配信の S3 に置いて CloudFront を無効化する(例: mise run deploy:admin dev)"
run = "scripts/deploy-spa.sh admin"

[tasks."plan:dev"]
description = "dev 環境の terraform plan(先に init が要る。README を参照)"
depends = ["build:api"]
dir = "infra/envs/dev"
run = "terraform plan"

[tasks."local:init"]
description = "ローカルの DynamoDB と S3 に、テーブルとバケットを作る"
run = "scripts/with-local-aws.sh scripts/local-init.sh"

[tasks.admin]
description = "管理コンソールの開発サーバーを起動する(http://localhost:5173)"
run = "pnpm --dir apps/admin dev"

[tasks.web]
description = "Web 版クライアントの開発サーバーを起動する(http://localhost:5174)"
run = "pnpm --dir apps/web dev"

[tasks.livekit]
description = "ローカルの LiveKit サーバーを起動する(--dev。ポートは compose が LAN に公開する)"
# 実機・エミュレーター・ブラウザに DEV_HOST で届くよう、DEV_HOST を候補のアドレスにする
run = "livekit-server --dev --bind 0.0.0.0 --node-ip {{env.DEV_HOST}}"

[tasks.agent]
description = "LiveKit Agent をローカルで起動する(ローカルの S3 に録音する)"
run = "scripts/with-local-aws.sh uv run python -m voice_intercom_agent start"

[tasks.dev]
description = "ローカルの全体(LiveKit、API、Agent、管理コンソール、Web 版)を一度に起動する"
# 待ち受け続けるタスクを並べて動かす。1つが落ちても(OPENAI_API_KEY が無い Agent など)ほかは止めない
run = "mise run --jobs 5 --continue-on-error livekit ::: api ::: agent ::: admin ::: web"

[tasks.catalog]
description = "UI 部品とデザイントークンの見本帳(packages/ui-web/catalog)の開発サーバーを起動する(http://localhost:5175)"
run = "pnpm --dir packages/ui-web/catalog dev"

[tasks."poc:tts"]
description = "端末の TTS(ブラウザの speechSynthesis)の PoC(tools/tts-poc)の開発サーバーを起動する(http://localhost:5176)"
run = "pnpm --dir tools/tts-poc dev"

[tasks."poc:ptt"]
description = "Push to Talk の spike(tools/ptt-poc)の Metro を起動する。ビルドは poc:ptt:ios(ホスト)"
run = "pnpm --dir tools/ptt-poc start"

[tasks."poc:ptt:ios"]
description = "Push to Talk の spike を iOS 向けにビルドして入れる(ホスト。例: mise run poc:ptt:ios --device)"
run = "pnpm --dir tools/ptt-poc exec expo run:ios"

[tasks."poc:ptt:push"]
description = "Push to Talk の push を APNs に送る(例: mise run poc:ptt:push --token <トークン> --speaker user2)"
# ホストでは .venv が devContainer のものなので、スクリプト用の環境を uv に作らせる
run = "env -u VIRTUAL_ENV uv run --script tools/ptt-poc/scripts/send_ptt_push.py"

[tasks.api]
description = "REST API をローカルで起動する(http://localhost:3000。ローカルの DynamoDB・S3・模擬 OIDC につなぐ)"
run = "scripts/with-local-aws.sh uv run python -m voice_intercom_api.local_server"
