[project]
name = "voice-intercom-api"
version = "0.1.0"
description = "API Gateway + Lambda(LiveKit トークン発行、履歴、管理 API、署名付き URL)"
requires-python = ">=3.14"
dependencies = [
    "aws-lambda-powertools>=3.35.0",
    "boto3>=1.43.110",
    "livekit-api>=1.2.1",
    "pydantic>=2.13.5",
    "pyjwt[crypto]>=2.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
