# Flutter のアプリ(apps/mobile)の静的解析と単体テスト。
# integration_test はシミュレーターとローカルの環境が要るので、ここでは動かさない
name: Flutter

on:
  pull_request:
    paths: &paths
      - apps/mobile/**
      # apps/mobile が path で参照している生成物
      - packages/api-client/dart/**
      - packages/schema/dart/**
      # ツールの版(Flutter は apps/mobile/mise.toml、ルートの mise.toml も読まれる)
      - mise.toml
      - .github/workflows/flutter.yml
      - .github/actions/setup/**
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  # apps/mobile ではルートの mise.toml も読まれるので、Flutter のほかは全部外す
  MISE_DISABLE_TOOLS: github:livekit/livekit,github:livekit/livekit-cli,gh,terraform,python,uv,node,pnpm,buf

jobs:
  flutter:
    name: flutter analyze と flutter test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          mise-cache-prefix: mise-v1-flutter
          working-directory: apps/mobile
      - name: pub のキャッシュ
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/mobile/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ runner.arch }}-
      # pubspec.lock と食い違っていたら落とす
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      # 引数なしでは test/ だけを動かす(integration_test/ は含まない)
      - run: flutter test
