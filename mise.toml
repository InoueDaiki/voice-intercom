# ツールの版とタスク。devContainer とホストの両方でこのファイルを使う。
# Flutter だけは apps/mobile/mise.toml で管理する(ホスト専用)。

[vars]
# LiveKit サーバーの版。devContainer の livekit-server と、ホストの mise run livekit のイメージの両方に使う
livekit_version = "1.13.9"

[tools]
python = "3.14.8"
uv = "0.12.23"
node = "24.21.0"
pnpm = "12.10.1"
terraform = "1.16.5"
buf = "1.73.0"
# macOS 向けのバイナリは配布されていないので、linux(devContainer)でだけ入れる。
# ホストでは mise run livekit が公式のイメージで動かす
"github:livekit/livekit" = { version = "{{vars.livekit_version}}", bin = "livekit-server", os = ["linux"] }
"github:livekit/livekit-cli" = { version = "2.18.8", bin = "lk" }
# GitHub CLI(PR や CI の確認。devContainer で使う。CI では入れない)
gh = "2.102.0"

[env]
_.file = ".env"
_.python.venv = { path = ".venv", create = false }
# Python は mise が入れたものを使い、uv には取得させない
UV_PYTHON_DOWNLOADS = "never"

[tasks.setup]
description = "依存関係をインストールする"
run = ["uv sync --all-packages", "pnpm install"]

[tasks.gen]
description = "proto と REST API から Python / TypeScript / Dart のコードを生成する"
depends = ["gen:proto", "gen:api"]

[tasks."gen:proto"]
description = "proto から Python / TypeScript / Dart の型を生成する"
run = "buf generate"

[tasks."gen:api"]
description = "Pydantic のモデルから OpenAPI を出し、TypeScript と Dart のクライアントを生成する"
dir = "packages/api-client"
# Dart の生成(openapi-generator)にだけ Java を使う。ホストの mise install では入らない
tools = { java = "temurin-25.0.4+7.0.LTS" }
env = { LANG = "C.UTF-8" }
run = [
  "uv run python -m voice_intercom_api.openapi > openapi.json",
  # openapi-typescript は TypeScript 7 では動かないので、5 系と一緒に dlx で動かす
  "pnpm --dir ts gen",
  # 消えたモデルのファイルが残らないよう、生成し直す
  "rm -rf dart/lib dart/.openapi-generator",
  "pnpm dlx @openapitools/openapi-generator-cli@2.41.0 generate --generator-key dart",
]

[tasks.lint]
description = "lint と型検査"
run = [
  "buf lint",
  "uv run ruff check",
  "uv run ruff format --check",
  "uv run pyright",
  "pnpm -r typecheck",
]

[tasks.fmt]
description = "整形"
run = ["buf format -w", "uv run ruff format", "uv run ruff check --fix"]

[tasks.test]
description = "テスト"
run = "uv run pytest"

[tasks."build:api"]
description = "Lambda(services/api)に載せるディレクトリを .build/api に作る"
run = "scripts/build-api.sh"

[tasks."build:agent"]
description = "Agent(services/agent)のイメージを linux/arm64 でビルドする(voice-intercom-agent:local)"
run = "docker build --platform linux/arm64 -f services/agent/Dockerfile -t voice-intercom-agent:local ."

[tasks."push:agent"]
description = "Agent のイメージをビルドして ECR に push する(例: mise run push:agent dev)"
run = "scripts/push-agent.sh"

[tasks."plan:dev"]
description = "dev 環境の terraform plan(先に init が要る。README を参照)"
depends = ["build:api"]
dir = "infra/envs/dev"
run = "terraform plan"

[tasks."local:init"]
description = "ローカルの DynamoDB と S3 に、テーブルとバケットを作る"
run = "scripts/with-local-aws.sh scripts/local-init.sh"

[tasks.admin]
description = "管理コンソールの開発サーバーを起動する(http://localhost:5173)"
run = "pnpm --dir apps/admin dev"

[tasks.livekit]
description = "ローカルの LiveKit サーバーを公式のイメージで起動する(ホストで実行。Docker が要る)"
run = """
docker run --rm --name voice-intercom-livekit \
  -p 7880:7880 -p 7881:7881 -p 7882:7882/udp \
  livekit/livekit-server:v{{vars.livekit_version}} \
  --dev --bind 0.0.0.0 --node-ip {{env.DEV_HOST}}
"""

[tasks.api]
description = "REST API をローカルで起動する(http://localhost:3000。ローカルの DynamoDB・S3・模擬 OIDC につなぐ)"
run = "scripts/with-local-aws.sh uv run python -m voice_intercom_api.local_server"
