name: voice_intercom
description: 翻訳つきのボイスインカムアプリ(iOS / Android)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  # 生成物(mise run gen)。手で編集しない
  voice_intercom_api_client:
    path: ../../packages/api-client/dart
  voice_intercom_schema:
    path: ../../packages/schema/dart
  # AudioManager.setMicrophoneMuteMode(inputMixer)は 2.9.0 以降
  livekit_client: ^2.13.1
  flutter_appauth: ^12.1.0
  flutter_secure_storage: ^11.2.0
  protobuf: ^6.1.0
  # 画像・動画(README の「画像・動画」と「パッケージを選んだ理由」)
  image_picker: ^1.2.4
  video_player: ^2.14.1
  image: ^4.12.0
  # 署名付き URL への PUT。統合テスト(integration_test/)でも模擬 OIDC からトークンを取るのに使う
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  # MediaMessage の size_bytes(Int64)をテストで作る
  fixnum: ^1.1.1
  # 統合テスト(integration_test/)で模擬 OIDC からトークンを取る
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
