[project]
name = "voice-intercom-agent"
version = "0.1.0"
description = "LiveKit Agent(話者の音声を OpenAI に中継し、字幕と翻訳音声を配信する)"
requires-python = ">=3.14"
dependencies = ["livekit-agents>=1.8.5,<2", "voice-intercom-schema"]

[tool.uv.sources]
voice-intercom-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
