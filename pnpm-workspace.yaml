packages:
  - apps/admin
  - apps/mobile
  - apps/web
  - packages/api-client/ts
  - packages/client-core
  - packages/client-react
  - packages/intercom-os
  - packages/design-tokens
  - packages/ui-native
  - packages/ui-web
  - packages/video-transcode
  - packages/ui-web/catalog
  - packages/schema/ts
  # PoC(開発用。配信しない)
  - tools/tts-poc
  - tools/ptt-poc
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.17'
  - '@expo/config-plugins@58.0.11'
  - '@expo/config@58.0.9'
  - '@expo/image-utils@0.12.6'
  - '@expo/inline-modules@0.2.8'
  - '@expo/local-build-cache-provider@58.0.9'
  - '@expo/metro-config@58.0.19'
  - '@expo/prebuild-config@58.0.17'
  - '@expo/require-utils@58.0.5'
  - '@expo/router-server@58.0.19'
  - babel-preset-expo@58.0.22
  - expo-asset@58.0.19
  - expo-constants@58.0.14
  - expo-file-system@58.0.13
  - expo-font@58.0.11
  - expo-modules-autolinking@58.0.16
  - expo-modules-cli@0.4.0
  - expo-modules-core@58.0.28
  - expo-modules-jsi@58.0.21
  - expo@58.0.21
# node_modules はホスト(macOS)と devContainer(Linux)で共有するので、両方のネイティブのバイナリを入れる
# (片方で install すると、もう片方の分が消えて動かなくなるため)
supportedArchitectures:
  os: [darwin, linux]
  cpu: [arm64]
  libc: [glibc]
