[project]
name = "voice-intercom-workspace"
version = "0.0.0"
requires-python = ">=3.14"

[dependency-groups]
dev = ["ruff>=0.16.10", "pyright>=1.1.414", "pytest>=9.1.1"]
# PoC(services/agent/poc)で使う。データセットの読み込みと訳の自動評価
poc = ["pyarrow>=26.0.0", "sacrebleu>=2.6.0"]

[tool.uv]
package = false
default-groups = ["dev", "poc"]

[tool.uv.workspace]
members = ["services/agent", "services/api", "packages/schema/python"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["*_pb2.py", "*_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
pythonVersion = "3.14"
include = ["services", "packages/schema/python"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["services", "packages/schema/python/tests"]
