name: voice-intercom

services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspaces/voice-intercom:cached
      - ${HOME}/.aws:/home/vscode/.aws
      - mise-data:/home/vscode/.local/share/mise
      - claude-config:/home/vscode/.claude
      - pnpm-store:/home/vscode/.local/share/pnpm-store
    # 実機やエミュレーターからも LAN の IP で届くように、VS Code の転送ではなく compose で公開する。
    # 実機が使わないポートは、ホストからだけ届くよう 127.0.0.1 に絞る
    ports:
      - "3000:3000" # API(ローカル実行。実機が DEV_HOST で使う)
      - "127.0.0.1:5173:5173" # 管理コンソール(Vite)
      - "127.0.0.1:5174:5174" # Web 版クライアント
      - "127.0.0.1:5175:5175" # UI 部品の見本帳(packages/ui-web/catalog)
      - "5176:5176" # 端末の TTS の PoC(tools/tts-poc。スマートフォンから DEV_HOST で開く)
      - "7880:7880" # LiveKit(シグナリング)
      - "7881:7881" # LiveKit(メディアの TCP)
      - "7882:7882/udp" # LiveKit(メディアの UDP)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ローカル用の模擬 OIDC サーバー(本番は Cognito)
  # issuer はリクエストの Host から決まるので、アプリとブラウザは http://${DEV_HOST}:8090/default で揃える
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4
    environment:
      SERVER_PORT: "8090"
      JSON_CONFIG_PATH: /config/mock-oidc.json
    volumes:
      - ./mock-oidc.json:/config/mock-oidc.json:ro
      - ./mock-oidc-login.html:/config/mock-oidc-login.html:ro
    ports:
      - "8090:8090"

  # ローカル用の DynamoDB(本番は DynamoDB)。テーブルは mise run local:init で作る
  dynamodb:
    image: amazon/dynamodb-local:3.3.0
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
    # 名前付きボリュームは root の所有で作られ、既定のユーザーでは書き込めないため
    user: root
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    ports:
      - "127.0.0.1:8000:8000" # コンテナからは compose のサービス名で届くので、LAN には出さない

  # ローカル用の S3(本番は S3 + CloudFront)。バケットは mise run local:init で作る
  # 実機が署名付き URL でアップロードするので、LAN に公開し、http://${DEV_HOST}:8333 で揃える
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.config=/config/s3.json -master.volumeSizeLimitMB=64
    volumes:
      - ./seaweedfs-s3.json:/config/s3.json:ro
      - s3-data:/data
    ports:
      - "8333:8333"

volumes:
  mise-data:
  claude-config:
  pnpm-store:
  dynamodb-data:
  s3-data:
