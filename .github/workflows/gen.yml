# 生成物(packages/schema/*、packages/api-client/*)がコミットされたものと一致するかを確かめる。
# gen:api は Java(openapi-generator)と pnpm dlx を使って重いので、生成に関係するパスが変わったときだけ動かす
name: 生成物

on:
  pull_request:
    paths: &paths
      - proto/**
      - buf.yaml
      - buf.gen.yaml
      - packages/schema/**
      - packages/api-client/**
      # OpenAPI は services/api の Pydantic のモデルから出す
      - services/api/**
      - pyproject.toml
      - uv.lock
      - pnpm-lock.yaml
      # ツールの版と gen のタスクの中身
      - mise.toml
      - .github/workflows/gen.yml
      - .github/actions/setup/**
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  MISE_DISABLE_TOOLS: github:livekit/livekit,github:livekit/livekit-cli,gh,terraform

jobs:
  gen:
    name: 生成物が最新か
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          mise-cache-prefix: mise-v1-gen
          # gen:api のタスクで入る Java もキャッシュに含める
          mise-cache-save-post: "true"
          python: "true"
      # pnpm dlx で取ってくる openapi-typescript と openapi-generator-cli(と、それが落とす jar)
      - name: pnpm dlx のキャッシュ
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pnpm/dlx
          key: >-
            pnpm-dlx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml',
            'packages/api-client/ts/package.json', 'packages/api-client/openapitools.json') }}
      - run: mise run gen
      # git diff は追跡していないファイルを見ないので、新しく増えたファイルも status で確かめる
      - name: 差分がないか
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::生成物が古い。mise run gen を実行して、結果をコミットする"
            exit 1
          fi
      - run: uv cache prune --ci
